name: YouTube Daily ETL (BQ Direct)

on:
  schedule:
    - cron: '0 18 * * *' # 日本時間 毎日午前3:00
  workflow_dispatch:

jobs:
  extract-and-load:
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-api-python-client google-cloud-bigquery tenacity

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Run ETL Pipeline
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          GCP_PROJECT_ID: 'youtube-analysis-v2-499813'
          BQ_DATASET: 'youtube_data'
          BQ_TABLE: 'raw_comments'
          TARGET_CHANNEL_ID: 'UCAWxPGGuIfWME2KTLUmSCHw'
        run: python main.py
