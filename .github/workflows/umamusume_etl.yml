name: UmaMusume ETL
on:
  schedule:
    - cron: '0 12 * * *' # Runs daily at 12:00
  workflow_dispatch:      # Enable manual trigger

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      GCP_PROJECT_ID: 'youtube-analysis-v2-499813'
      BQ_DATASET: 'youtube_data'
      BRAND_NAME: 'UMAMUSUME'
      TARGET_CHANNEL_ID: ${{ secrets.CHANNEL_ID_UMAMUSUME }}
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with: {python-version: '3.9'}
      
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v1
        with:
          credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          
      - run: |
          pip install google-api-python-client google-cloud-bigquery tenacity deep-translator
          python main.py
