name: JAL ETL
on:
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      GCP_PROJECT_ID: 'youtube-analysis-v2-499813'
      BQ_DATASET: 'youtube_data'
      BRAND_NAME: 'JAL'
      TARGET_CHANNEL_ID: ${{ secrets.CHANNEL_ID_JAL }}
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with: {python-version: '3.9'}
      - run: |
          pip install google-api-python-client google-cloud-bigquery tenacity
          python main.py
